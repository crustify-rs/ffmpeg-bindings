[package]
name = "nearest-refuses-lists-c-finishes"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
ffmpeg = { package = "ffmpeg-bindings", path = "../../../../../..", default-features = false, features = ["libavutil"] }
# A direct dependency only so that `DEP_AVUTIL_LIB_DIR` reaches `build.rs`,
# which embeds the prebuilt library's rpath as the ffmpeg crate does for its
# own tests.
libavutil-sys = { path = "../../../../../../libavutil-sys" }
