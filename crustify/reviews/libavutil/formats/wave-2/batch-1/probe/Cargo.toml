[package]
name = "line-probe"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone differential probe of pixdesc::read_image_line / write_image_line
# (formats wave-2 symbol review): `cargo run -- <rounds> <seed>`; exits non-zero
# on a verdict the transliterated C loop disagrees with. Build it with the
# asan-ubsan variant (see the review README) to have ASan watch the accepted
# lines on their exactly sized planes.
[workspace]

[dependencies]
ffmpeg = { path = "../../../../../../../../crustify/rust/ffmpeg", default-features = false, features = ["libavutil"] }
libavutil-sys = { path = "../../../../../../../../crustify/rust/libavutil-sys" }
