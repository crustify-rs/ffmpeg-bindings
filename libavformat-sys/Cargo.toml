[package]
name = "libavformat-sys"
description = "Raw FFI bindings to FFmpeg's libavformat"
links = "avformat"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# C doc comments carry C code blocks that are not Rust doctests.
doctest = false

[dependencies]
libavcodec-sys.workspace = true
libavutil-sys.workspace = true

[build-dependencies]
bindgen = { workspace = true, optional = true }
cc.workspace = true
pkg-config.workspace = true
serde_json.workspace = true

[features]
# Regenerates the bindings from the headers of the library found, in place of the shipped ones.
bindgen = ["dep:bindgen"]
