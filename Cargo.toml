[package]
name = "ffmpeg-bindings"
description = "Safe Rust wrappers over FFmpeg's public C API"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["libavutil", "libswresample", "libswscale", "libavcodec", "libavformat", "libavfilter", "libavdevice"]
libavutil = ["dep:libavutil-sys", "dep:glibc-bindings"]
libswresample = ["dep:libswresample-sys", "libavutil"]
libswscale = ["dep:libswscale-sys", "libavutil"]
libavcodec = ["dep:libavcodec-sys", "libswresample", "libavutil"]
libavformat = ["dep:libavformat-sys", "libavcodec", "libavutil"]
libavfilter = ["dep:libavfilter-sys", "libswscale", "libavformat", "libavcodec", "libswresample", "libavutil"]
libavdevice = ["dep:libavdevice-sys", "libavfilter", "libavformat", "libavcodec", "libavutil"]

[dependencies]
ffibox.workspace = true
glibc-bindings = { workspace = true, optional = true }
libavutil-sys = { workspace = true, optional = true }
libswresample-sys = { workspace = true, optional = true }
libswscale-sys = { workspace = true, optional = true }
libavcodec-sys = { workspace = true, optional = true }
libavformat-sys = { workspace = true, optional = true }
libavfilter-sys = { workspace = true, optional = true }
libavdevice-sys = { workspace = true, optional = true }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    ".",
    "libavutil-sys",
    "libswresample-sys",
    "libswscale-sys",
    "libavcodec-sys",
    "libavformat-sys",
    "libavfilter-sys",
    "libavdevice-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/crustify-rs/ffmpeg-bindings"
license = "LGPL-2.1-or-later"
publish = false

[workspace.dependencies]
bindgen = { version = "0.73", features = ["experimental"] }
cc = "1.5"
ffibox = { git = "https://github.com/crustify-rs/ffibox", rev = "203b1a05269bdd549459a80d5d58d6c2f2689d01" }
serde_json = "1"
trybuild = "1"
libavutil-sys = { path = "libavutil-sys" }
libswresample-sys = { path = "libswresample-sys" }
libswscale-sys = { path = "libswscale-sys" }
libavcodec-sys = { path = "libavcodec-sys" }
libavformat-sys = { path = "libavformat-sys" }
libavfilter-sys = { path = "libavfilter-sys" }
libavdevice-sys = { path = "libavdevice-sys" }
# Wrappers of the out-of-tree libraries, each pinned to its side campaign's working branch
# (`wrapper.pin` in crustify/artifacts/dependencies.json), and patched below to its clone
# beside this repository while the campaign extends it.
glibc-bindings = { git = "https://github.com/crustify-rs/glibc-bindings", rev = "d53dd7b662c912d58b35b8b94d32603b5145c287" }

[patch."https://github.com/crustify-rs/glibc-bindings"]
glibc-bindings = { path = "../glibc-bindings" }

# ffibox is pinned by Git so that this crate and the wrappers it takes by Git
# resolve one copy of it; patched to the local checkout while the campaign runs.
[patch."https://github.com/crustify-rs/ffibox"]
ffibox = { path = "/opt/venv/share/ffibox" }

[workspace.metadata.crustify]
nightly = "nightly-2026-10-08"

[workspace.lints.rust]
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
module_inception = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
